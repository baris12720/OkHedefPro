<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ok Hedef Pro V5</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:4;pointer-events:none}.box{padding:7px 12px;border:1px solid #ffffff22;background:#07101db8;backdrop-filter:blur(10px);border-radius:14px}.box small{display:block;font-size:9px;opacity:.6}.box b{font-size:17px}.spacer{flex:1}.btn{pointer-events:auto;border:1px solid #ffffff2c;background:#ffffff18;color:white;border-radius:13px;padding:10px 14px;font-weight:800}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#03081199;z-index:8}.panel{width:min(900px,92vw);max-height:90vh;overflow:auto;padding:28px;border-radius:28px;background:#081322e8;border:1px solid #ffffff22;backdrop-filter:blur(18px);box-shadow:0 30px 80px #0008}h1{font-size:clamp(32px,6vw,64px);margin:0}.muted{opacity:.65}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:16px}.lvl{aspect-ratio:1;border:1px solid #ffffff18;border-radius:10px;background:#ffffff0d;color:#fff;font-weight:900}.lock{opacity:.25}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.hidden{display:none}.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:12px;background:#07101daa;font-size:12px;z-index:4;pointer-events:none}.big{font-size:38px;font-weight:950;text-align:center}
</style></head><body><canvas id="c"></canvas><div id="hud" class="hud hidden"><div class="box"><small>SKOR</small><b id="sc">0</b></div><div class="box"><small>KOMBO</small><b id="co">x0</b></div><div class="box"><small>ATIŞ</small><b id="sh">0/0</b></div><div class="box spacer"><small id="rg">Bölge</small><b id="tp">Hedef</b></div><button class="btn" id="pause">Ⅱ</button></div><div id="hint" class="hint hidden">Ekranın istediğin yerine dokun — ok oraya atılır</div>
<div id="menu" class="screen"><div class="panel"><h1>OK HEDEF PRO</h1><p class="muted">V5 • Tam ekran • Hassas dokunmatik ok atışı • 50 bölüm</p><div>🏆 Rekor: <b id="best">0</b> &nbsp; 🔓 Açık: <b id="unl">1</b>/50</div><div class="row"><button class="btn" id="start">OYUNA BAŞLA</button><button class="btn" id="reset">SIFIRLA</button></div><h2>Bölüm Seç</h2><div id="levels" class="grid"></div></div></div>
<div id="res" class="screen hidden"><div class="panel" style="text-align:center"><div id="ico" style="font-size:58px">🏆</div><h1 id="rt">Bölüm Tamam</h1><div class="big" id="rs">0</div><p id="rx" class="muted"></p><div class="row" style="justify-content:center"><button class="btn" id="next">SONRAKİ</button><button class="btn" id="back">MENÜ</button></div></div></div>
<div id="pauseScr" class="screen hidden"><div class="panel" style="text-align:center"><h1>DURAKLATILDI</h1><button class="btn" id="resume">DEVAM ET</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,d=1;function size(){W=innerWidth;H=innerHeight;d=devicePixelRatio||1;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();
const R=[['Yeşil Vadi','🌲','#0b3028','#38705c'],['Kızıl Kanyon','🏜️','#351716','#874b3d'],['Buz Krallığı','❄️','#102c40','#4c8eae'],['Kara Volkan','🌋','#190d14','#672b35'],['Kraliyet Zirvesi','👑','#10172f','#50539a']],T=[['Normal','🎯'],['Hareketli','↔️'],['Buz','❄️'],['Bomba','💣'],['Kalkanlı','🛡️']];
let unlocked=+localStorage.okUnlocked||1,best=+localStorage.okBest||0,level=1,score=0,combo=0,shots=0,hits=0,playing=false,paused=false,arrow=null,particles=[],target={x:0,y:0,r:0,t:0};
const $=id=>document.getElementById(id), reg=l=>R[Math.floor((l-1)/10)], typ=l=>T[Math.floor((l-1)/10)], goal=l=>3+Math.floor((l-1)/10), maxShots=l=>5+Math.floor((l-1)/10);
function menu(){playing=false;$('hud').classList.add('hidden');$('hint').classList.add('hidden');$('best').textContent=best;$('unl').textContent=unlocked;$('levels').innerHTML='';for(let i=1;i<=50;i++){let b=document.createElement('button');b.className='lvl'+(i>unlocked?' lock':'');b.textContent=i;b.onclick=()=>i<=unlocked&&start(i);$('levels').appendChild(b)}$('menu').classList.remove('hidden');$('res').classList.add('hidden')}
function start(l){level=l;score=combo=shots=hits=0;particles=[];arrow=null;paused=false;playing=true;target.r=Math.min(W,H)*.11;target.x=W*.72;target.y=H*.42+Math.random()*H*.17;$('rg').textContent=reg(l)[1]+' '+reg(l)[0];$('tp').textContent=typ(l)[1]+' '+typ(l)[0];$('hud').classList.remove('hidden');$('hint').classList.remove('hidden');$('menu').classList.add('hidden');$('res').classList.add('hidden');$('pauseScr').classList.add('hidden');hud()}
function hud(){$('sc').textContent=score;$('co').textContent='x'+combo;$('sh').textContent=shots+'/'+maxShots(level)}
function bg(){let a=reg(level),g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,a[2]);g.addColorStop(1,a[3]);x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#0004';for(let i=0;i<8;i++){let xx=i*W/7;x.beginPath();x.moveTo(xx-180,H*.68);x.lineTo(xx,H*.68-(80+(i%3)*40));x.lineTo(xx+180,H*.68);x.fill()}x.fillStyle='#0004';x.fillRect(0,H*.68,W,H*.32)}
function targetDraw(){let t=target,ty=typ(level)[0];x.save();x.translate(t.x,t.y);x.shadowColor='#0008';x.shadowBlur=24;x.fillStyle='#e9edf2';x.beginPath();x.arc(0,0,t.r,0,7);x.fill();x.shadowBlur=0;[['#1e2631',1],['#f0f0f0',.82],['#bd2633',.63],['#f3f3f3',.45],['#225c98',.29],['#f0c747',.14]].forEach(q=>{x.fillStyle=q[0];x.beginPath();x.arc(0,0,t.r*q[1],0,7);x.fill()});if(ty==='Buz'){x.strokeStyle='#bcefff';x.lineWidth=6;for(let i=0;i<8;i++){let a=i*Math.PI/4;x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(a)*t.r,Math.sin(a)*t.r);x.stroke()}}if(ty==='Bomba'){x.fillStyle='#10151d';x.beginPath();x.arc(0,0,t.r*.25,0,7);x.fill();x.fillStyle='white';x.font='900 '+t.r*.32+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('!',0,2)}if(ty==='Kalkanlı'){x.strokeStyle='#a8e9ff';x.lineWidth=9;x.beginPath();x.arc(0,0,t.r*1.1,0,7);x.stroke()}if(ty==='Hareketli'){x.strokeStyle='#ffffff38';x.lineWidth=5;x.beginPath();x.moveTo(-t.r*2.2,0);x.lineTo(t.r*2.2,0);x.stroke()}x.restore()}
function arrowDraw(){if(!arrow)return;x.save();x.translate(arrow.x,arrow.y);x.rotate(Math.atan2(arrow.vy,arrow.vx));x.strokeStyle='#d8b27b';x.lineWidth=4;x.beginPath();x.moveTo(-55,0);x.lineTo(8,0);x.stroke();x.fillStyle='#eaf0f5';x.beginPath();x.moveTo(12,0);x.lineTo(-2,-8);x.lineTo(-2,8);x.closePath();x.fill();x.fillStyle='#c88b4a';x.beginPath();x.moveTo(-55,0);x.lineTo(-44,-8);x.lineTo(-44,8);x.closePath();x.fill();x.restore()}
function burst(px,py,good){for(let i=0;i<28;i++){let a=Math.random()*7,s=80+Math.random()*300;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.8+Math.random()*.5,g:good})}}function pdraw(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=250*dt;if(p.l<=0){particles.splice(i,1);continue}x.globalAlpha=p.l;x.fillStyle=p.g?'#ffd34f':'#ed5870';x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill()}x.globalAlpha=1}
function fire(px,py){if(!playing||paused||arrow||shots>=maxShots(level))return;shots++;let sx=W*.5,sy=H*.78,dx=px-sx,dy=py-sy,m=Math.hypot(dx,dy)||1;arrow={x:sx,y:sy,vx:dx/m*1350,vy:dy/m*1350};hud()}
function hit(){let d=Math.hypot(arrow.x-target.x,arrow.y-target.y),ok=d<target.r;if(typ(level)[0]==='Kalkanlı'&&Math.random()<.3)ok=false;if(ok){hits++;combo++;score+=Math.round(700*(1-d/target.r*.5)*(1+Math.min(combo,8)*.15))+(typ(level)[0]==='Bomba'?500:0);burst(target.x,target.y,true)}else{combo=0;burst(arrow.x,arrow.y,false)}arrow=null;hud();if(hits>=goal(level)){playing=false;best=Math.max(best,score);localStorage.okBest=best;if(level>=unlocked&&unlocked<50){unlocked=level+1;localStorage.okUnlocked=unlocked}result(true)}else if(shots>=maxShots(level)){playing=false;result(false)}}
function result(win){$('ico').textContent=win?'🏆':'💥';$('rt').textContent=win?'Bölüm Tamamlandı':'Atışlar Bitti';$('rs').textContent=score.toLocaleString('tr-TR');$('rx').textContent=`${hits}/${goal(level)} isabet • Kombo x${combo}`;$('next').style.display=win&&level<50?'inline-block':'none';$('res').classList.remove('hidden');$('hint').classList.add('hidden')}
let last=performance.now();function loop(now){let dt=Math.min(.035,(now-last)/1000);last=now;bg();if(playing&&!paused){target.t+=dt;if(typ(level)[0]==='Hareketli')target.x=W*.72+Math.sin(target.t*1.8)*W*.17;if(arrow){arrow.x+=arrow.vx*dt;arrow.y+=arrow.vy*dt;arrow.vy+=420*dt;let dd=Math.hypot(arrow.x-target.x,arrow.y-target.y);if(dd<target.r||arrow.x<-150||arrow.x>W+150||arrow.y>H+150)hit()}}targetDraw();arrowDraw();pdraw(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
// Kritik düzeltme: dokunulan yer doğrudan hedef alınır; ok her atıştan önce ekranın ortasında görünür.
c.addEventListener('pointerdown',e=>{if(!playing||paused)return;fire(e.clientX,e.clientY)});
$('pause').onclick=()=>{paused=true;$('pauseScr').classList.remove('hidden')};$('resume').onclick=()=>{paused=false;$('pauseScr').classList.add('hidden')};$('start').onclick=()=>start(unlocked);$('next').onclick=()=>start(Math.min(50,level+1));$('back').onclick=menu;$('reset').onclick=()=>{if(confirm('İlerleme sıfırlansın mı?')){localStorage.clear();unlocked=1;best=0;menu()}};menu();
</script></body></html>
